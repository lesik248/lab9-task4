name: Build all platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.27.4"
  APP_NAME: "bus_booking_pro"
  APP_ORG: "com.example.busbookingpro"
  PAGES_BASE_HREF: "/lab9-task4/"

jobs:
  test:
    name: Unit + widget tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit + widget tests
        run: flutter test --reporter expanded

  integration-linux:
    name: Integration tests (Linux desktop)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake clang pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb network-manager

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Run integration tests under Xvfb
        run: |
          set -o pipefail
          failed=0
          for t in integration_test/*.dart; do
            echo "===== $t ====="
            if ! xvfb-run -a flutter test -d linux --reporter expanded "$t"; then
              failed=1
            fi
          done
          exit "$failed"

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: bus-booking-pro-android-debug-apk
          path: build/app/outputs/flutter-apk/*.apk

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake clang pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Bundle Linux release
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ${{ github.workspace }}/bus-booking-pro-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: bus-booking-pro-linux
          path: bus-booking-pro-linux.tar.gz

  web:
    name: Web (build + Pages artifact)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter build web --release --base-href "${{ env.PAGES_BASE_HREF }}"

      - name: Disable Jekyll for Pages
        run: touch build/web/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: bus-booking-pro-web
          path: build/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  ios:
    name: iOS Simulator (.app for Appetize)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Scaffold platform folders
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create \
            --platforms=android,ios,linux,web \
            --project-name=${{ env.APP_NAME }} \
            --org=${{ env.APP_ORG }} \
            .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Default Flutter template adds test/widget_test.dart referencing
          # MyApp — delete it; our tests live under test/unit & test/widget.
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Build iOS Simulator .app (no codesign)
        run: flutter build ios --simulator --debug --no-codesign

      - name: Zip the .app bundle
        run: |
          cd build/ios/iphonesimulator
          ls -la
          zip -ry "${{ github.workspace }}/bus-booking-pro-ios-simulator.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: bus-booking-pro-ios-simulator-app
          path: bus-booking-pro-ios-simulator.zip
