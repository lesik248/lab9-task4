name: bus_booking_pro
description: "Кроссплатформенное бронирование автобусов (lab9, task4, Ярмош) — Flutter/Android/iOS/Linux/Web"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.7

  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  shared_preferences: ^2.3.2

  fl_chart: ^0.69.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
